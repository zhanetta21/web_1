<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — The Bloom</title>
  <link rel="stylesheet" href="css/a.css" />
  <link rel="stylesheet" href="css/final.css" />
</head>
<body>

  <header class="final-header">
    <a class="final-brand" href="index.html">
      <img src="images/logo.svg" alt="Bloom logo" />
      The Bloom
    </a>

    <nav class="final-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="reserve.html">Reserve</a>
      <a href="contact.html">Contact</a>
      <a class="bloom-nav-link auth-guest" href="signup.html">Sign Up</a>
      <a class="bloom-nav-link auth-guest" href="login.html">Log In</a>
      <a class="bloom-nav-link auth-user" href="profile.html">Profile</a>
      <button class="bloom-nav-link auth-user logout-link" id="navLogout" type="button">Log Out</button>
    </nav>

    <button class="theme-control" id="themeToggle" type="button">Dark mode</button>
  </header>

  <main class="final-main">
    <section class="final-panel">
      <h1>Log in</h1>
      <p>Welcome back!</p>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="text" placeholder="" />
        <small class="field-error" id="email-error"></small>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="" />
        <small class="field-error" id="password-error"></small>

        <button class="final-button" type="submit">Log In</button>
        <p class="form-message" id="formMessage" aria-live="polite"></p>
      </form>

      <p>New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <footer class="final-footer">
    The Bloom Café · Made with care in Astana
  </footer>

  <script defer src="js/final.js"></script>
</body>
</html>
